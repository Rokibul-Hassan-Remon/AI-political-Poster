<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: linear-gradient(180deg, {{primary}} 0%, {{secondary}} 100%);
  display: flex; flex-direction: column; align-items: center; padding: 80px 70px 60px; text-align: center;
}
body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 22px; background: {{accent}}; }
.ribbon { width: 120px; height: 120px; border: 22px solid {{accent}}; border-radius: 50%; margin-bottom: 30px; }
.headline { font-weight: 700; line-height: 1.25; }
.lg { font-size: 92px; } .xl { font-size: 112px; } .\32xl { font-size: 136px; }
.photos { flex: 1; display: flex; gap: 50px; align-items: center; justify-content: center; width: 100%; margin: 40px 0; }
.photo { width: 460px; height: 580px; object-fit: cover; filter: grayscale(100%); border: 10px solid {{text}}; }
.n1 .photo { width: 600px; height: 740px; }
.divider { width: 60%; height: 4px; background: {{accent}}; margin-bottom: 30px; }
.name { font-size: 72px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 40px; line-height: 1.4; opacity: .9; }
</style>
</head>
<body>
  <div class="ribbon"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="divider"></div>
  <div data-layer="info">
  <div class="name">{{name}}</div>
  <div class="meta">{{designation}}, {{organization}}</div>
  <div class="meta">{{area}}</div>
  </div>
</body>
</html>
