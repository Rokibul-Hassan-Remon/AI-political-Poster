<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse 900px 800px at 50% 30%, {{secondary}} 0%, {{primary}} 75%);
  display: flex; flex-direction: column; align-items: center; padding: 70px 70px 64px; text-align: center; position: relative;
}
/* Thin accent frame + top bar. Decorations sit at z-index -1, behind every movable part. */
body::before { content: ''; position: absolute; z-index: -1; left: 0; right: 0; top: 0; height: 22px; background: {{accent}}; }
body::after { content: ''; position: absolute; z-index: -1; inset: 54px 34px 34px; border: 3px solid {{accent}}88; }
/* Awareness-style mourning ribbon: two crossed tails and a loop. */
.ribbon { position: relative; width: 120px; height: 150px; flex-shrink: 0; margin: 10px 0 70px; transform: scale(1.4); transform-origin: top center; }
.ribbon::before, .ribbon::after { content: ''; position: absolute; top: 40px; left: 43px; width: 34px; height: 110px; background: {{accent}}; border-radius: 4px; transform-origin: top center; }
.ribbon::before { transform: rotate(24deg); } .ribbon::after { transform: rotate(-24deg); filter: brightness(.8); }
.ribbon i { position: absolute; left: 25px; top: 0; width: 70px; height: 84px; border: 18px solid {{accent}}; border-radius: 50% 50% 46% 46%; }
.headline { font-weight: 700; line-height: 1.2; -webkit-text-stroke: 5px {{primary}}; paint-order: stroke fill; text-shadow: 0 14px 34px rgba(0,0,0,.6); }
.lg { font-size: 96px; } .xl { font-size: 116px; } .\32xl { font-size: 140px; }
.photos { flex: 1; display: flex; gap: 44px; align-items: center; justify-content: center; width: 100%; margin: 30px 0; }
.photo { width: 460px; height: 600px; object-fit: cover; filter: grayscale(100%) contrast(1.05); border: 10px solid #fff; outline: 3px solid {{accent}}; outline-offset: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.7); }
.n1 .photo { width: 620px; height: 780px; }
.n3 .photo { width: 300px; height: 400px; } .n3 .main { width: 380px; height: 500px; }
/* Line - diamond - line divider above the name. */
.divider { position: relative; width: 520px; height: 26px; margin-bottom: 26px; flex-shrink: 0;
  background: linear-gradient({{accent}}, {{accent}}) left center / 220px 3px no-repeat, linear-gradient({{accent}}, {{accent}}) right center / 220px 3px no-repeat; }
.divider::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; background: {{accent}}; transform: rotate(45deg); }
.name { font-size: 80px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 42px; line-height: 1.4; opacity: .9; }
</style>
</head>
<body>
  <div class="ribbon"><i></i></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="divider"></div>
  <div data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
