<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,.35) 100%), {{primary}};
  border: 26px solid {{accent}}; outline: 4px solid {{accent}}; outline-offset: -44px;
  display: flex; flex-direction: column; align-items: center; padding: 70px 60px 56px; text-align: center; position: relative;
}
/* Decorations sit at z-index -1: behind every movable part, above the body background. */
/* Sun rays fanning out from the red sun behind the photos. */
.rays { position: absolute; z-index: -1; left: 50%; top: 760px; width: 2000px; height: 2000px; margin: -1000px 0 0 -1000px;
  background: repeating-conic-gradient(rgba(255,255,255,.07) 0 5deg, transparent 5deg 10deg);
  -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 55%); mask-image: radial-gradient(circle, #000 15%, transparent 55%); }
/* The flag's red sun, with a gold ring and soft glow. */
.sun { position: absolute; z-index: -1; left: 50%; top: 760px; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffffff30, transparent 60%), {{secondary}};
  box-shadow: 0 0 0 10px {{primary}}, 0 0 0 16px {{accent}}, 0 0 120px 30px {{secondary}}88; }
.headline { font-weight: 700; line-height: 1.2; color: {{text}};
  -webkit-text-stroke: 6px {{primary}}; paint-order: stroke fill; text-shadow: 0 6px 0 {{accent}}, 0 16px 34px rgba(0,0,0,.5); }
.lg { font-size: 100px; } .xl { font-size: 124px; } .\32xl { font-size: 148px; }
/* Gold line with a diamond in the middle, under the headline. */
.orn { position: relative; width: 460px; height: 26px; margin-top: 18px; flex-shrink: 0;
  background: linear-gradient({{accent}}, {{accent}}) left center / 190px 4px no-repeat, linear-gradient({{accent}}, {{accent}}) right center / 190px 4px no-repeat; }
.orn::after { content: ''; position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; background: {{accent}}; transform: rotate(45deg); box-shadow: 0 0 0 6px {{primary}}, 0 0 0 9px {{accent}}; }
.photos { flex: 1; display: flex; gap: 30px; align-items: center; justify-content: center; width: 100%; margin: 20px 0; }
.photo { width: 360px; height: 470px; object-fit: cover; border: 12px solid {{accent}}; border-radius: 28px; box-shadow: 0 0 0 5px {{primary}}, 0 24px 50px rgba(0,0,0,.5); }
.n1 .photo { width: 600px; height: 760px; }
.n2 .photo { width: 470px; height: 610px; }
.n3 .photo { width: 310px; height: 410px; } .n3 .main { width: 390px; height: 520px; }
.footer { position: relative; width: 100%; background: linear-gradient(180deg, #ffffff40, transparent 50%), {{accent}}; color: {{primary}};
  border-radius: 28px; padding: 30px 40px 32px; box-shadow: 0 18px 40px rgba(0,0,0,.4), inset 0 0 0 4px {{primary}}, inset 0 0 0 8px {{accent}}; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 42px; line-height: 1.4; }
.chip { display: inline-block; margin-top: 10px; padding: 4px 40px; border-radius: 999px; background: {{primary}}; color: {{accent}}; font-weight: 700; }
.chip:empty { display: none; }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="sun"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="orn"></div>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta chip">{{area}}</div>
  </div>
</body>
</html>
