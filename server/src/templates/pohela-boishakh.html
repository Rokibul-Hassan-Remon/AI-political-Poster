<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}}; background: {{primary}};
  display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
}
/* Lal-paar sari border: red bands with a marigold stripe, top and bottom. */
body::before, body::after { content: ''; position: absolute; left: 0; right: 0; height: 60px; background: {{secondary}}; }
body::before { top: 0; border-bottom: 10px solid {{accent}}; }
body::after { bottom: 0; border-top: 10px solid {{accent}}; }
/* Rising sun behind the photos, with alpana-style dotted rings. */
.sun { position: absolute; top: 420px; left: 50%; width: 820px; height: 820px; margin-left: -410px; border-radius: 50%;
  background: radial-gradient(circle, {{accent}}55 0 52%, transparent 53%), repeating-radial-gradient(circle, transparent 0 34px, {{secondary}}33 35px 39px); }
.headline { position: relative; z-index: 1; font-weight: 700; line-height: 1.25; color: {{secondary}}; padding: 120px 60px 0; }
.lg { font-size: 96px; } .xl { font-size: 120px; } .\32xl { font-size: 144px; }
.photos { position: relative; z-index: 1; flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; padding: 30px 50px; }
.photo { width: 320px; height: 420px; object-fit: cover; border: 12px solid {{secondary}}; outline: 6px solid {{accent}}; border-radius: 24px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.n1 .photo { width: 520px; height: 680px; }
.n2 .photo { width: 430px; height: 560px; }
.footer { position: relative; z-index: 1; width: 100%; padding: 30px 50px 110px; }
.name { font-size: 76px; font-weight: 700; line-height: 1.2; color: {{secondary}}; }
.meta { font-size: 40px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="sun"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
