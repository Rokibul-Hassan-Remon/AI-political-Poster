<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.12) 100%), linear-gradient(180deg, {{primary}} 0%, {{secondary}} 100%);
  display: flex; flex-direction: column; align-items: center; padding: 110px 80px 76px; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Black mourning sash across the top-left corner, plus a double inner border like a condolence card. */
body::before { content: ''; position: absolute; z-index: -1; top: 70px; left: -110px; width: 480px; height: 76px; background: {{accent}}; transform: rotate(-45deg); box-shadow: 0 0 0 6px {{primary}}, 0 0 0 9px {{accent}}; }
body::after { content: ''; position: absolute; z-index: -1; inset: 30px; border: 5px solid {{accent}}; outline: 2px solid {{accent}}; outline-offset: -16px; }
/* Thin rings behind the photos. */
.rings { position: absolute; z-index: -1; left: 50%; top: 820px; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%;
  background: repeating-radial-gradient(circle, transparent 0 40px, {{accent}}14 41px 43px);
  -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 70%); mask-image: radial-gradient(circle, #000 30%, transparent 70%); }
.tag { font-size: 46px; font-weight: 700; letter-spacing: 4px; opacity: .75; margin-bottom: 6px; }
.headline { font-weight: 700; line-height: 1.2; text-shadow: 0 6px 18px rgba(0,0,0,.18); }
.lg { font-size: 92px; } .xl { font-size: 112px; } .\32xl { font-size: 136px; }
.photos { flex: 1; display: flex; gap: 46px; align-items: center; justify-content: center; width: 100%; margin: 36px 0; }
.photo { width: 440px; height: 580px; object-fit: cover; filter: grayscale(100%) contrast(1.05); border: 14px solid {{accent}}; outline: 3px solid {{accent}}; outline-offset: 10px; box-shadow: 0 30px 50px rgba(0,0,0,.3); }
.n1 .photo { width: 600px; height: 760px; }
.n3 .photo { width: 280px; height: 370px; } .n3 .main { width: 350px; height: 460px; }
/* Line - diamond - line divider above the name. */
.rule { position: relative; width: 520px; height: 24px; margin-bottom: 24px; flex-shrink: 0;
  background: linear-gradient({{accent}}, {{accent}}) left center / 220px 3px no-repeat, linear-gradient({{accent}}, {{accent}}) right center / 220px 3px no-repeat; }
.rule::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; background: {{accent}}; transform: rotate(45deg); }
.name { font-size: 80px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 42px; line-height: 1.4; opacity: .85; }
</style>
</head>
<body>
  <div class="rings"></div>
  <div class="tag">বিনম্র শ্রদ্ধা</div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="rule"></div>
  <div data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
