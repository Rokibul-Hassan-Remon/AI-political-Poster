<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: linear-gradient(180deg, {{primary}} 0%, {{secondary}} 100%);
  display: flex; flex-direction: column; align-items: center; padding: 110px 70px 60px; text-align: center; position: relative;
}
/* Black mourning sash across the top-left corner, plus an inner border like a condolence card. */
body::before { content: ''; position: absolute; top: 70px; left: -110px; width: 460px; height: 70px; background: {{accent}}; transform: rotate(-45deg); }
body::after { content: ''; position: absolute; inset: 30px; border: 4px solid {{accent}}; pointer-events: none; }
.tag { font-size: 44px; font-weight: 600; opacity: .8; margin-bottom: 10px; }
.headline { font-weight: 700; line-height: 1.25; }
.lg { font-size: 88px; } .xl { font-size: 108px; } .\32xl { font-size: 132px; }
.photos { flex: 1; display: flex; gap: 44px; align-items: center; justify-content: center; width: 100%; margin: 40px 0; }
.photo { width: 440px; height: 560px; object-fit: cover; filter: grayscale(100%); border: 14px solid {{accent}}; }
.n1 .photo { width: 580px; height: 720px; }
.rule { width: 50%; height: 3px; background: {{accent}}; margin-bottom: 26px; }
.name { font-size: 72px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 40px; line-height: 1.4; opacity: .85; }
</style>
</head>
<body>
  <div class="tag">বিনম্র শ্রদ্ধা</div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="rule"></div>
  <div data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
