<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse 900px 800px at 50% 35%, color-mix(in srgb, {{primary}} 75%, #fff), {{primary}} 70%);
  display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Snowfall: two offset grids of soft white dots. */
.snow { position: absolute; z-index: -1; inset: 0;
  background: radial-gradient(circle, #ffffff55 3px, transparent 4px) 0 0 / 90px 90px, radial-gradient(circle, #ffffff33 2px, transparent 3px) 45px 45px / 90px 90px; }
/* Green footer band with a gold edge; a string of fairy lights sits on that edge. */
.band { position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(180deg, #ffffff1a, transparent 40%), {{secondary}};
  border-top: 14px solid {{accent}}; }
.band::before { content: ''; position: absolute; left: 0; right: 0; top: -30px; height: 40px;
  background: radial-gradient(circle, #fff6c2 0 6px, {{accent}} 8px, transparent 12px) 0 0 / 60px 40px repeat-x; filter: drop-shadow(0 0 8px {{accent}}); }
/* Glowing five-point star above the headline. */
.star { width: 140px; height: 140px; margin-top: 46px; flex-shrink: 0; background: {{accent}}; filter: drop-shadow(0 0 30px {{accent}});
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.headline { font-weight: 700; line-height: 1.2; color: {{accent}}; padding: 16px 60px 0; -webkit-text-stroke: 6px {{primary}}; paint-order: stroke fill; text-shadow: 0 5px 0 {{secondary}}, 0 16px 34px rgba(0,0,0,.5); }
.lg { font-size: 104px; } .xl { font-size: 128px; } .\32xl { font-size: 152px; }
.photos { flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; padding: 10px 50px 70px; }
.photo { width: 330px; height: 430px; object-fit: cover; border: 12px solid {{accent}}; border-radius: 28px; box-shadow: 0 0 0 6px {{primary}}, 0 0 0 9px {{accent}}88, 0 24px 50px rgba(0,0,0,.45); }
.n1 .photo { width: 520px; height: 680px; }
.n2 .photo { width: 440px; height: 580px; }
.n3 .photo { width: 290px; height: 380px; } .n3 .main { width: 360px; height: 470px; }
.footer { height: 326px; display: flex; flex-direction: column; justify-content: center; padding: 0 60px; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{accent}}; }
.meta { font-size: 42px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="snow"></div>
  <div class="band"></div>
  <div class="star"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
