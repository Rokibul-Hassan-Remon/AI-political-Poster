<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}}; background: {{primary}};
  display: flex; flex-direction: column; align-items: center; padding: 70px 60px 60px; text-align: center;
}
/* The user's own design fills the page (cropped to 3:4); everything else sits on top and can be moved in the editor. */
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
.headline { font-weight: 700; line-height: 1.2; -webkit-text-stroke: 6px rgba(0,0,0,.6); paint-order: stroke fill; text-shadow: 0 6px 0 {{accent}}, 0 16px 34px rgba(0,0,0,.7); }
.lg { font-size: 96px; } .xl { font-size: 120px; } .\32xl { font-size: 144px; }
.photos { flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; margin: 40px 0; }
.photo { width: 330px; height: 430px; object-fit: cover; border-radius: 24px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.n1 .photo { width: 560px; height: 700px; }
.n2 .photo { width: 440px; height: 560px; }
.n3 .photo { width: 290px; height: 380px; } .n3 .main { width: 360px; height: 470px; }
.footer { background: rgba(0,0,0,.6); border-radius: 28px; padding: 28px 56px; box-shadow: 0 18px 40px rgba(0,0,0,.4), inset 0 0 0 3px {{accent}}; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{accent}}; }
.meta { font-size: 42px; line-height: 1.4; }
</style>
</head>
<body>
  <img class="bg" src="{{backgroundUrl}}" alt="">
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
