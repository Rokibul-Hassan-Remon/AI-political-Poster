<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(circle at 50% 48%, {{secondary}} 0%, {{primary}} 70%);
  border: 20px solid {{accent}}; outline: 4px solid {{accent}}; outline-offset: -36px;
  display: flex; flex-direction: column; align-items: center; padding: 50px 56px 46px; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Mandala behind the photos: rays, petals and concentric gold rings. */
.mandala { position: absolute; z-index: -1; left: 50%; top: 760px; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%;
  background: repeating-radial-gradient(circle, transparent 0 28px, {{accent}}40 29px 32px), repeating-conic-gradient({{accent}}22 0 5deg, transparent 5deg 15deg);
  -webkit-mask-image: radial-gradient(circle, #000 45%, transparent 70%); mask-image: radial-gradient(circle, #000 45%, transparent 70%); }
/* Diya-like flames along the top: 10 lamps spaced to fit the width exactly, so none is cut at the edge. */
.lamps { width: 1000px; height: 46px; flex-shrink: 0;
  background: radial-gradient(ellipse 13px 22px at 50% 40%, #fff3b0 0 30%, {{accent}} 60%, transparent 100%) 0 0 / 100px 46px repeat-x;
  filter: drop-shadow(0 0 10px {{accent}}); }
.headline { font-weight: 700; line-height: 1.2; color: {{accent}}; margin-top: 24px; -webkit-text-stroke: 6px {{primary}}; paint-order: stroke fill; text-shadow: 0 5px 0 {{primary}}, 0 16px 34px rgba(0,0,0,.55); }
.lg { font-size: 100px; } .xl { font-size: 124px; } .\32xl { font-size: 148px; }
.photos { flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; margin: 24px 0; }
.photo { width: 320px; height: 320px; object-fit: cover; border-radius: 50%; border: 12px solid {{accent}}; box-shadow: 0 0 0 10px {{primary}}, 0 0 0 16px {{accent}}, 0 0 60px 20px {{accent}}55, 0 16px 40px rgba(0,0,0,.5); }
.n1 .photo { width: 580px; height: 580px; }
.n2 .photo { width: 460px; height: 460px; }
.n3 .photo { width: 290px; height: 290px; } .n3 .main { width: 390px; height: 390px; }
.footer { width: 100%; padding: 26px 40px 10px; border-image: linear-gradient(90deg, transparent, {{accent}} 15% 85%, transparent) 1; border-width: 6px 0 0; border-style: solid;
  background: linear-gradient(180deg, {{primary}}aa, transparent); }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{accent}}; }
.meta { font-size: 42px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="mandala"></div>
  <div class="lamps"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
