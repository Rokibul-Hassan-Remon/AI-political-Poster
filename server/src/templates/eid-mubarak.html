<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse 900px 700px at 50% 45%, {{secondary}} 0%, {{primary}} 80%);
  border: 24px double {{accent}}; display: flex; flex-direction: column; align-items: center;
  padding: 70px 60px 50px; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Faint diamond lattice over the whole poster. */
.lattice { position: absolute; z-index: -1; left: 50%; top: 50%; width: 2000px; height: 2000px; margin: -1000px 0 0 -1000px; transform: rotate(45deg);
  background: linear-gradient({{accent}}1c 2px, transparent 2px) 0 0 / 90px 90px, linear-gradient(90deg, {{accent}}1c 2px, transparent 2px) 0 0 / 90px 90px; }
/* Crescent (inset shadow on a transparent circle) with a soft glow, and a few stars. */
.moon { position: absolute; z-index: -1; top: 40px; right: 60px; width: 190px; height: 190px; border-radius: 50%; box-shadow: inset -46px 20px 0 0 {{accent}}; transform: scaleX(-1); filter: drop-shadow(0 0 24px {{accent}}aa); }
.stars { position: absolute; z-index: -1; inset: 0; background:
  radial-gradient(circle at 12% 9%, {{accent}} 0 5px, transparent 6px), radial-gradient(circle at 22% 17%, {{accent}}cc 0 3px, transparent 4px),
  radial-gradient(circle at 70% 6%, {{accent}}cc 0 4px, transparent 5px), radial-gradient(circle at 6% 30%, {{accent}}99 0 3px, transparent 4px),
  radial-gradient(circle at 94% 26%, {{accent}}cc 0 4px, transparent 5px), radial-gradient(circle at 60% 15%, {{accent}}99 0 3px, transparent 4px); }
/* Warm glow behind the photos. */
.glow { position: absolute; z-index: -1; left: 50%; top: 800px; width: 1000px; height: 800px; margin: -400px 0 0 -500px; border-radius: 50%; background: radial-gradient(closest-side, {{accent}}40, transparent); }
.headline { font-weight: 700; line-height: 1.2; color: {{accent}}; -webkit-text-stroke: 6px {{primary}}; paint-order: stroke fill; text-shadow: 0 5px 0 {{primary}}, 0 16px 34px rgba(0,0,0,.55); margin-top: 40px; }
.lg { font-size: 104px; } .xl { font-size: 128px; } .\32xl { font-size: 152px; }
.photos { flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; margin: 30px 0; }
.photo { width: 330px; height: 440px; object-fit: cover; border: 12px solid {{accent}}; border-radius: 200px 200px 24px 24px; box-shadow: 0 0 0 6px {{primary}}, 0 0 0 9px {{accent}}88, 0 24px 50px rgba(0,0,0,.5); }
.n1 .photo { width: 560px; height: 740px; border-radius: 290px 290px 28px 28px; }
.n2 .photo { width: 460px; height: 610px; border-radius: 240px 240px 28px 28px; }
.n3 .photo { width: 300px; height: 410px; } .n3 .main { width: 370px; height: 500px; border-radius: 200px 200px 24px 24px; }
.footer { position: relative; width: 100%; padding: 30px 40px; background: linear-gradient(90deg, transparent, {{primary}}cc 20% 80%, transparent);
  border-image: linear-gradient(90deg, transparent, {{accent}} 15% 85%, transparent) 1; border-width: 5px 0; border-style: solid; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{accent}}; }
.meta { font-size: 42px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="lattice"></div>
  <div class="glow"></div>
  <div class="stars"></div>
  <div class="moon"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
