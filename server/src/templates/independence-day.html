<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,.3) 100%), {{primary}};
  display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Rays from the red disc, which sits centred behind the photos. */
.rays { position: absolute; z-index: -1; left: 50%; top: 720px; width: 2000px; height: 2000px; margin: -1000px 0 0 -1000px;
  background: repeating-conic-gradient(rgba(255,255,255,.07) 0 5deg, transparent 5deg 10deg);
  -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 50%); mask-image: radial-gradient(circle, #000 15%, transparent 50%); }
.disc { position: absolute; z-index: -1; left: 50%; top: 720px; width: 720px; height: 720px; margin: -360px 0 0 -360px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffffff30, transparent 60%), {{secondary}}; box-shadow: 0 0 0 12px {{primary}}, 0 0 0 18px {{accent}}, 0 0 120px 30px {{secondary}}77; }
/* Red footer band with a gold edge and a thin inner gold line. */
.band { position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(180deg, #ffffff1f, transparent 40%), {{secondary}};
  border-top: 14px solid {{accent}}; box-shadow: 0 -10px 30px rgba(0,0,0,.3); }
.band::after { content: ''; position: absolute; left: 30px; right: 30px; top: 18px; bottom: 30px; border: 3px solid {{accent}}88; border-radius: 20px; }
.headline { font-weight: 700; line-height: 1.2; padding: 76px 60px 0; -webkit-text-stroke: 6px {{primary}}; paint-order: stroke fill; text-shadow: 0 6px 0 {{accent}}, 0 16px 34px rgba(0,0,0,.5); }
.lg { font-size: 100px; } .xl { font-size: 124px; } .\32xl { font-size: 148px; }
.photos { flex: 1; display: flex; gap: 26px; align-items: center; justify-content: center; width: 100%; padding: 20px 50px 70px; }
.photo { width: 300px; height: 300px; object-fit: cover; border-radius: 50%; border: 12px solid {{accent}}; box-shadow: 0 0 0 6px {{primary}}, 0 24px 50px rgba(0,0,0,.45); }
.n1 .photo { width: 580px; height: 580px; }
.n2 .photo { width: 450px; height: 450px; }
.n3 .photo { width: 290px; height: 290px; } .n3 .main { width: 400px; height: 400px; }
.footer { height: 326px; display: flex; flex-direction: column; justify-content: center; padding: 0 60px; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{accent}}; text-shadow: 0 4px 12px rgba(0,0,0,.3); }
.meta { font-size: 42px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="disc"></div>
  <div class="band"></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
