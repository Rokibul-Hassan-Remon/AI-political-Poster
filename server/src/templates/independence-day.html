<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}}; background: {{primary}};
  display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
}
/* Flag: red disc behind the photos, set slightly toward the hoist; red footer band below. */
body::before { content: ''; position: absolute; top: 380px; left: 50%; width: 760px; height: 760px; margin-left: -420px; border-radius: 50%; background: {{secondary}}; }
body::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: {{secondary}}; border-top: 14px solid {{accent}}; }
.headline { position: relative; z-index: 1; font-weight: 700; line-height: 1.25; padding: 80px 60px 0; text-shadow: 0 6px 18px rgba(0,0,0,.35); }
.lg { font-size: 96px; } .xl { font-size: 120px; } .\32xl { font-size: 144px; }
.photos { position: relative; z-index: 1; flex: 1; display: flex; gap: 36px; align-items: center; justify-content: center; width: 100%; padding: 30px 50px 60px; }
.photo { width: 300px; height: 300px; object-fit: cover; border-radius: 50%; border: 12px solid {{accent}}; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.n1 .photo { width: 560px; height: 560px; }
.n2 .photo { width: 430px; height: 430px; }
.n3 .main { width: 380px; height: 380px; }
.footer { position: relative; z-index: 1; height: 316px; display: flex; flex-direction: column; justify-content: center; padding: 0 50px; }
.name { font-size: 76px; font-weight: 700; line-height: 1.2; color: {{accent}}; }
.meta { font-size: 40px; line-height: 1.4; }
</style>
</head>
<body>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
