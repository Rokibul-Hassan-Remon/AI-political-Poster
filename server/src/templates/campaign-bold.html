<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body { font-family: 'Hind Siliguri', sans-serif; background: {{secondary}}; color: {{text}}; display: flex; flex-direction: column; }
.top { background: {{primary}}; color: {{secondary}}; padding: 70px 60px 140px; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%); }
.headline { font-weight: 700; line-height: 1.25; }
.lg { font-size: 96px; } .xl { font-size: 120px; } .\32xl { font-size: 144px; }
.photos { position: relative; display: flex; justify-content: center; margin-top: -110px; }
.photo { width: 640px; height: 760px; object-fit: cover; border: 16px solid {{secondary}}; outline: 10px solid {{accent}}; border-radius: 32px; }
.bottom { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px 60px 60px; }
.name { font-size: 84px; font-weight: 700; line-height: 1.2; color: {{primary}}; }
.meta { font-size: 42px; line-height: 1.4; }
.bar { margin-top: 24px; background: {{accent}}; color: #fff; font-size: 40px; font-weight: 700; padding: 12px 48px; border-radius: 999px; }
.bar:empty { display: none; }
</style>
</head>
<body>
  <div class="top"><h1 class="headline {{headlineSize}}">{{headline}}</h1></div>
  <div class="photos">{{photos}}</div>
  <div class="bottom">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="bar">{{area}}</div>
  </div>
</body>
</html>
