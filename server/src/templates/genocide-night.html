<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1600px; overflow: hidden; }
body {
  font-family: 'Hind Siliguri', sans-serif; color: {{text}};
  background: radial-gradient(ellipse 900px 760px at 50% 0%, {{secondary}} 0%, {{primary}} 72%);
  display: flex; flex-direction: column; align-items: center; padding: 56px 60px 56px; text-align: center; position: relative;
}
/* Decorations sit at z-index -1, behind every movable part. */
/* Dark red haze rising from the bottom, and a thin frame. */
body::before { content: ''; position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; height: 700px; background: radial-gradient(ellipse 800px 500px at 50% 100%, {{accent}}55, transparent 70%); }
body::after { content: ''; position: absolute; z-index: -1; inset: 28px; border: 2px solid {{accent}}aa; }
/* A single lit candle (memorial vigil). */
.candle { position: relative; width: 60px; height: 200px; flex-shrink: 0; }
.flame { position: absolute; left: 50%; top: 0; width: 44px; height: 78px; margin-left: -22px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; background: radial-gradient(circle at 50% 70%, #fff7c2 0 25%, #ffb627 55%, #e85d04 100%); box-shadow: 0 0 80px 34px rgba(255,170,40,.35); }
.wax { position: absolute; left: 0; bottom: 0; width: 60px; height: 112px; background: linear-gradient(90deg, #cfcfcf, #fff 45%, #d8d8d8); border-radius: 6px 6px 0 0; }
.headline { font-weight: 700; line-height: 1.2; margin-top: 30px; -webkit-text-stroke: 5px {{primary}}; paint-order: stroke fill; text-shadow: 0 5px 0 {{accent}}, 0 16px 34px rgba(0,0,0,.7); }
.lg { font-size: 96px; } .xl { font-size: 116px; } .\32xl { font-size: 140px; }
.photos { flex: 1; display: flex; gap: 50px; align-items: center; justify-content: center; width: 100%; margin: 36px 0; }
.photo { width: 450px; height: 590px; object-fit: cover; filter: grayscale(100%) contrast(1.1); border: 8px solid {{accent}}; outline: 2px solid #ffffff55; outline-offset: 8px; box-shadow: 0 0 60px rgba(0,0,0,.9); }
.n1 .photo { width: 600px; height: 760px; }
.n3 .photo { width: 290px; height: 380px; } .n3 .main { width: 360px; height: 470px; }
.footer { width: 100%; padding-top: 28px; border-image: linear-gradient(90deg, transparent, {{accent}} 15% 85%, transparent) 1; border-width: 6px 0 0; border-style: solid; }
.name { font-size: 80px; font-weight: 700; line-height: 1.2; }
.meta { font-size: 42px; line-height: 1.4; opacity: .85; }
</style>
</head>
<body>
  <div class="candle"><div class="flame"></div><div class="wax"></div></div>
  <h1 data-layer="headline" class="headline {{headlineSize}}">{{headline}}</h1>
  <div class="photos n{{photoCount}}">{{photos}}</div>
  <div class="footer" data-layer="info">
    <div class="name">{{name}}</div>
    <div class="meta">{{designation}}, {{organization}}</div>
    <div class="meta">{{area}}</div>
  </div>
</body>
</html>
